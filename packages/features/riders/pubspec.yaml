name: la10_riders
description: riders feature module for La 10.
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.0
  web: ^1.1.0
  flutter_ringtone_player: ^4.0.0+3
  vibration: ^2.0.0
  # FCM para notificaciones push con la app cerrada o el celu bloqueado.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  # Local notifications para mostrar la oferta estilo "llamada entrante" con
  # fullScreenIntent + canal high importance. Sin esto el FCM solo deja una
  # notif normal estilo mensaje.
  flutter_local_notifications: ^18.0.1
  # Para pedir overlay + ignore-battery + Android14 fullScreenIntent perms
  # cuando el rider toca "Estoy en linea". Sin esto la notif call-style no
  # aparece con el celu bloqueado o con otra app en foreground.
  permission_handler: ^11.3.1
  la10_auth:
    path: ../auth
  la10_core:
    path: ../../core
  la10_dispatch:
    path: ../dispatch
  la10_data:
    path: ../../data
  la10_geo:
    path: ../../geo
  la10_ui:
    path: ../../ui

dev_dependencies:
  very_good_analysis: ^6.0.0
