# Compila el APK de la app mobile (apps/mobile) en cada push a main
# o manualmente desde "Actions → Run workflow". El .apk firmado con la
# debug keystore se sube como artifact descargable desde la corrida.
#
# Para que funcione, el repo necesita un secret llamado `ENV_FILE` que
# contenga el contenido completo del archivo `.env` (SUPABASE_URL,
# SUPABASE_ANON_KEY, etc). Eso se inyecta en el build via dart-define.

name: build-apk

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'

      - name: Reconstruir .env desde secret
        run: echo "${{ secrets.ENV_FILE }}" > "$GITHUB_WORKSPACE/.env"

      - name: Instalar melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: dart pub global run melos bootstrap

      - name: Build APK release
        working-directory: apps/mobile
        run: flutter build apk --release --dart-define-from-file=../../.env

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: la10-rider-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
